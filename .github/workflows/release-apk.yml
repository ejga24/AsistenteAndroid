name: Build NEXO Release Candidate

on:
  workflow_dispatch:

concurrency:
  group: nexo-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.NEXO_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.NEXO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXO_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.NEXO_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing NEXO_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASS" || (echo "Missing NEXO_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing NEXO_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASS" || (echo "Missing NEXO_KEY_PASSWORD" && exit 1)

      - name: Materialize release keystore
        env:
          KEYSTORE_B64: ${{ secrets.NEXO_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nexo-release.jks"
          chmod 600 "$RUNNER_TEMP/nexo-release.jks"

      - name: Test lint and build signed release
        env:
          STORE_PASS: ${{ secrets.NEXO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXO_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.NEXO_KEY_PASSWORD }}
        run: |
          gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace \
            -PNEXO_KEYSTORE_FILE="$RUNNER_TEMP/nexo-release.jks" \
            -PNEXO_KEYSTORE_PASSWORD="$STORE_PASS" \
            -PNEXO_KEY_ALIAS="$KEY_ALIAS" \
            -PNEXO_KEY_PASSWORD="$KEY_PASS"

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          apksigner verify --verbose --print-certs "$APK"

      - name: Upload signed RC APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-Agent-signed-rc
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-Agent-release-lint
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
