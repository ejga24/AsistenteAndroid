name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, nexo-agent-v3 ]

permissions:
  contents: read

concurrency:
  group: nexo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Smoke-test signed release plumbing
        env:
          CI_STORE_PASS: nexo-ci-disposable-only
          CI_KEY_PASS: nexo-ci-disposable-only
          CI_KEY_ALIAS: nexo-ci
        run: |
          keytool -genkeypair             -keystore "$RUNNER_TEMP/nexo-ci.jks"             -storepass "$CI_STORE_PASS"             -keypass "$CI_KEY_PASS"             -alias "$CI_KEY_ALIAS"             -dname "CN=NEXO CI Disposable,O=NEXO CI,C=PA"             -keyalg RSA             -keysize 2048             -validity 1

          gradle :app:assembleRelease --stacktrace             -PNEXO_KEYSTORE_FILE="$RUNNER_TEMP/nexo-ci.jks"             -PNEXO_KEYSTORE_PASSWORD="$CI_STORE_PASS"             -PNEXO_KEY_ALIAS="$CI_KEY_ALIAS"             -PNEXO_KEY_PASSWORD="$CI_KEY_PASS"

          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1)"
          echo "$BADGING" | grep -q "name='com.eliel.asistente'"
          echo "$BADGING" | grep -q "versionCode='17'"
          echo "$BADGING" | grep -q "versionName='3.0-rc1'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-Agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-Agent-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore


      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-Agent-unit-tests
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore


      - name: Upload release lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-Agent-release-lint
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
