name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, nexo-agent-v3 ]

permissions:
  contents: read

concurrency:
  group: nexo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-Agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-Agent-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore


      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-Agent-unit-tests
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore


      - name: Upload release lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-Agent-release-lint
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
