name: Build Uber Filter APK

on:
  push:
    branches:
      - uber-filtro-rentabilidad
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: uber-filter-stable-debug-keystore-v1

      - name: Create signing key if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v               -keystore ~/.android/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Filtro-Uber-v3.1-continuous-ocr
          path: app/build/outputs/apk/debug/app-debug.apk
